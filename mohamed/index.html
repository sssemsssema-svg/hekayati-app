<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>مفاجأة الغلاف المتحرك للبطل محمد ✨</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Cairo', Tahoma, sans-serif;
      background: radial-gradient(circle at top, #dbeafe, #e0e7ff 55%, #fef3c7);
      margin: 0;
      padding: 18px;
      color: #1e1b4b;
      text-align: center;
      min-height: 100vh;
    }
    .card {
      max-width: 480px;
      margin: 10px auto;
      background: rgba(255, 255, 255, 0.96);
      border-radius: 28px;
      padding: 22px 18px;
      box-shadow: 0 20px 50px rgba(37, 99, 235, 0.18);
      border: 2px solid #fbbf24;
    }
    .badge {
      display: inline-block;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: #fff;
      padding: 6px 16px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 800;
      margin-bottom: 10px;
    }
    h1 {
      font-size: 22px;
      margin: 4px 0 10px;
      color: #1e3a8a;
    }
    .video-wrap {
      position: relative;
      border-radius: 22px;
      overflow: hidden;
      background: #0f172a;
      box-shadow: 0 12px 30px rgba(15, 23, 42, 0.25);
      border: 3px solid #fbbf24;
      margin: 12px 0 16px;
    }
    video {
      width: 100%;
      display: block;
      max-height: 70vh;
    }
    .dedication-box {
      background: #eff6ff;
      border: 1.5px dashed #3b82f6;
      border-radius: 18px;
      padding: 14px 16px;
      font-size: 16px;
      line-height: 1.75;
      color: #1e3a8a;
      margin-bottom: 16px;
    }
    .dl-btn {
      display: inline-block;
      text-decoration: none;
      background: linear-gradient(135deg, #2563eb, #4f46e5);
      color: #fff;
      font-weight: 800;
      font-size: 15px;
      padding: 12px 24px;
      border-radius: 999px;
      box-shadow: 0 8px 20px rgba(37, 99, 235, 0.3);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">🏅 حكاياتي الملونة • إهداء خاص</div>
    <h1>غلاف حكاية «محمد» بيتحرك ويتكلم! 🎬</h1>
    <div class="video-wrap">
      <video src="./mohamed.mp4" poster="./poster.png" controls autoplay playsinline></video>
    </div>
    <div class="dedication-box">أهلاً يا أصحابي، أنا محمد! تعالوا شوفوا مغامرتي في المدرسة! 🏆🤸‍♂️</div>
    <a class="dl-btn" href="./mohamed.mp4" download="Mohamed_Gym_Heroes.mp4">⬇️ حفظ فيديو الإهداء على الموبايل</a>
  </div>
</body>
</html>
