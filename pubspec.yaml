name: my_colorful_tales
description: "My Colorful Tales Flutter Application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  google_fonts: ^6.2.1
  http: ^1.2.2
  record: ^5.1.2
  path_provider: ^2.1.4
  printing: ^5.13.2
  share_plus: ^10.0.0
  gal: ^2.3.0
  image_picker: ^1.2.4
  pdf: ^3.13.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

dependency_overrides:
  record_linux: 1.3.1

flutter:
  uses-material-design: true
